name: M2 verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Verify M2 including the fresh-input failure and recovery demo
        shell: pwsh
        run: ./eng/verify.ps1
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-verification
          retention-days: 7
          path: |
            artifacts/verification/
            artifacts/test-results/*.trx
            tests/RelayLab.Tests/bin/Release/net10.0/TestResults/containers/*.log
          if-no-files-found: warn
